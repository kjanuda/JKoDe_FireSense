
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Figure 2.21 Calibration</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f5f5f5;
}

h2 {
    margin-bottom: 8px;
}

.instructions {
    margin-bottom: 20px;
    line-height: 1.5;
}

.viewer {
    position: relative;
    display: inline-block;
    border: 1px solid #444;
}

#figure {
    display: block;
    width: 1973px;
    height: 990px;
}

#marker {
    position: absolute;
    width: 12px;
    height: 12px;
    border: 2px solid red;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    display: none;
}

pre {
    margin-top: 20px;
    padding: 15px;
    background: white;
    border: 1px solid #ccc;
}

button {
    margin-top: 15px;
    margin-right: 8px;
    padding: 8px 14px;
}
</style>
</head>

<body>

<h2>Figure 2.21 Axis Calibration</h2>

<div class="instructions">
Click these points in order:
<br>
1. x-axis LEFT intersection
<br>
2. x-axis RIGHT end
<br>
3. y-axis TOP end
<br>
4. y-axis BOTTOM intersection
<br><br>
Expected scientific ranges:
<br>
x = 0 → 800 µm
<br>
y = 0 → 10 mm/s
</div>

<div class="viewer">
    <img
        id="figure"
        src="file:///E:/Nasa/FireSense/data/figures/SRC-NASA-20210011385/embedded/figures_2_21_2_22/page_050_image_01.jpeg"
        alt="Figure 2.21"
    >
    <div id="marker"></div>
</div>

<br>

<button onclick="undoClick()">
Undo
</button>

<button onclick="resetClicks()">
Reset
</button>

<pre id="output"></pre>

<script>

const labels = [
    "x_left",
    "x_right",
    "y_top",
    "y_bottom"
];

let clicks = [];

const img = document.getElementById(
    "figure"
);

const output = document.getElementById(
    "output"
);

const marker = document.getElementById(
    "marker"
);

function render() {

    const result = {};

    clicks.forEach(
        (point, index) => {
            result[
                labels[index]
            ] = point;
        }
    );

    output.textContent =
        JSON.stringify(
            result,
            null,
            2
        );

    if (clicks.length > 0) {

        const last =
            clicks[
                clicks.length - 1
            ];

        marker.style.left =
            last.x + "px";

        marker.style.top =
            last.y + "px";

        marker.style.display =
            "block";

    } else {

        marker.style.display =
            "none";
    }
}

img.addEventListener(
    "click",
    function(event) {

        if (
            clicks.length
            >= labels.length
        ) {
            return;
        }

        const rect =
            img.getBoundingClientRect();

        const scaleX =
            img.naturalWidth
            / rect.width;

        const scaleY =
            img.naturalHeight
            / rect.height;

        const x =
            Math.round(
                (
                    event.clientX
                    - rect.left
                )
                * scaleX
            );

        const y =
            Math.round(
                (
                    event.clientY
                    - rect.top
                )
                * scaleY
            );

        clicks.push(
            {
                x: x,
                y: y
            }
        );

        render();
    }
);

function undoClick() {
    clicks.pop();
    render();
}

function resetClicks() {
    clicks = [];
    render();
}

render();

</script>

</body>
</html>
